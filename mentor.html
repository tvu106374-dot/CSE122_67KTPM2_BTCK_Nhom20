<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OnboardAI – Hành trình hội nhập nhân sự mới</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700&display=swap">
<style>
:root{color-scheme:light;--bg:#edf3f1;--sf:#fff;--ink:#14232b;--mut:#5b6b72;--pr:#0e7c66;--prx:#dff2ec;--ac:#f2a93b;--bd:#d3dfdb;--er:#c0392b;--ok:#1e8e4e;--wa:#a86a0c;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0e191d;--sf:#16252a;--ink:#e8f0ee;--mut:#93a6ac;--pr:#3fc4a4;--prx:#17332f;--bd:#27393f;--ac:#f2b34f;--er:#ff7b6b;--ok:#4cd08a;--wa:#f0b552;--on:#08201a}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0e191d;--sf:#16252a;--ink:#e8f0ee;--mut:#93a6ac;--pr:#3fc4a4;--prx:#17332f;--bd:#27393f;--ac:#f2b34f;--er:#ff7b6b;--ok:#4cd08a;--wa:#f0b552;--on:#08201a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1{font-size:1.6rem;margin:0 0 .2rem;line-height:1.2}h2{font-size:1.15rem;margin:0 0 .6rem}h3{font-size:1rem;margin:0 0 .4rem}p{margin:.2rem 0 .8rem}.sub{color:var(--mut);margin-bottom:1.2rem}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.btn{background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:.45rem .85rem;cursor:pointer;min-height:38px}
.btn:hover{border-color:var(--pr)}.btn.pr{background:var(--pr);color:var(--on);border-color:var(--pr);font-weight:500}.btn.dn{color:var(--er)}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{min-height:30px;padding:.15rem .55rem;font-size:.85rem}
input,select,textarea{background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:.5rem .65rem;width:100%}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--pr)}
label{display:block;margin-bottom:.8rem;font-weight:500}label input,label select,label textarea{margin-top:.25rem;font-weight:400}
.err{color:var(--er);display:block;min-height:1em;font-weight:400}[aria-invalid=true]{border-color:var(--er)}
.top{display:flex;gap:.6rem;align-items:center;padding:.6rem 1rem;background:var(--sf);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:.4rem;font-size:1.1rem}.sp{flex:1}
.ly{display:grid;grid-template-columns:210px 1fr;min-height:calc(100vh - 58px)}
nav{padding:1rem .7rem;border-right:1px solid var(--bd);display:flex;flex-direction:column;gap:.3rem;background:var(--sf)}
nav button{text-align:left;background:none;border:0;border-radius:8px;padding:.6rem .8rem;cursor:pointer}
nav button:hover{background:var(--prx)}nav button[aria-current=page]{background:var(--pr);color:var(--on);font-weight:700}
main{padding:1.4rem clamp(1rem,3vw,2.2rem);max-width:1100px;width:100%}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:1.1rem}.card.warn{border-color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:.9rem}
.cols{display:grid;grid-template-columns:1.2fr 1fr;gap:1rem;margin-bottom:1rem}
.bar,.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin-bottom:1rem}.bar input[type=search]{flex:1;min-width:160px}.bar select{width:auto}
.tw{overflow-x:auto;border:1px solid var(--bd);border-radius:12px;background:var(--sf)}
table{border-collapse:collapse;width:100%;min-width:560px}th,td{padding:.65rem .8rem;text-align:left;border-bottom:1px solid var(--bd);vertical-align:top}th{color:var(--mut);font-weight:500;font-size:.88rem}tr:last-child td{border:0}tr.off td{opacity:.55}td.ac{white-space:nowrap;text-align:right}
.b{display:inline-block;padding:.05rem .55rem;border-radius:99px;font-size:.8rem;border:1px solid currentColor;font-weight:500}.b.ok{color:var(--ok)}.b.wa{color:var(--wa)}.b.er{color:var(--er)}.b.pr{color:var(--pr)}
.av{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:50%;color:#fff;font-weight:700;font-size:.85rem;flex:none}
.pg{height:8px;background:var(--prx);border-radius:9px;overflow:hidden}.pg i{display:block;height:100%;background:var(--pr)}
.sk{height:16px;border-radius:6px;margin:.6rem 0;background:linear-gradient(90deg,var(--prx),var(--bd),var(--prx));background-size:200% 100%;animation:sk 1.2s linear infinite}@keyframes sk{to{background-position:-200% 0}}
.em{text-align:center;padding:2rem 1rem;color:var(--mut)}.em svg{width:64px;margin-bottom:.4rem}
.tk{display:flex;gap:.7rem;align-items:center;padding:.6rem 0;border-bottom:1px solid var(--bd)}.tk:last-child{border:0}.tk span{flex:1}.tk.done span{text-decoration:line-through;color:var(--mut)}
.tl{list-style:none;margin:0;padding:0 0 0 1rem;border-left:3px dotted var(--bd)}.tl li{position:relative;padding:.3rem 0 .8rem 1rem}.tl li:before{content:"";position:absolute;left:-1.62rem;top:.5rem;width:14px;height:14px;border-radius:50%;background:var(--bg);border:3px solid var(--bd)}.tl li.d:before{background:var(--pr);border-color:var(--pr)}.tl li.c:before{border-color:var(--ac);background:var(--ac)}
.chip{display:inline-block;background:var(--prx);border-radius:8px;padding:.1rem .55rem;margin:.1rem .2rem .1rem 0;font-size:.85rem}
.note{padding:.6rem .8rem;border-radius:8px;background:var(--prx)}.note.er{color:var(--er)}
dialog{border:1px solid var(--bd);border-radius:14px;background:var(--sf);color:var(--ink);width:min(480px,92vw);padding:1.2rem}dialog::backdrop{background:#0008}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(1rem + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:.4rem;z-index:20}
.ts{background:var(--ink);color:var(--bg);padding:.55rem .9rem;border-radius:10px;display:flex;gap:.8rem;align-items:center}.ts button{background:none;border:0;color:var(--ac);cursor:pointer;font-weight:700}
details{margin:.5rem 0}summary{cursor:pointer;color:var(--pr);font-weight:500}
@media(max-width:760px){.ly{grid-template-columns:1fr}nav{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--bd);padding:.5rem}nav button{white-space:nowrap}.cols{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"></div><div id="toast" role="status" aria-live="polite"></div><dialog id="dlg"></dialog>
<script>
const $=(s,e=document)=>e.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').toLowerCase();
const day=n=>{const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)},fd=s=>s?s.split('-').reverse().join('/'):'—',wait=ms=>new Promise(r=>setTimeout(r,ms));
const LOGO='<svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="13" style="fill:var(--pr)"/><path d="M6 18c4 0 3-7 7-7s3 4 7-3" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><circle cx="20" cy="8" r="2.4" style="fill:var(--ac)"/></svg>';
const EMP='<svg viewBox="0 0 64 64" aria-hidden="true"><rect x="10" y="14" width="44" height="38" rx="6" fill="none" style="stroke:var(--bd)" stroke-width="3"/><path d="M18 26h28M18 34h20M18 42h12" style="stroke:var(--bd)" stroke-width="3" stroke-linecap="round"/></svg>';
const RL={mentor:'Mentor / Quản lý'},LV={high:['Cao','er'],mid:['Trung bình','wa'],low:['Thấp','ok']};
const KEY='onboardai-v1';

function mk(){
  const H=[['h1','Trần Minh Anh','Kỹ thuật',-12,5],['h2','Nguyễn Thu Hà','Thiết kế',-20,6],['h3','Phạm Đức Long','Kinh doanh',-9,1],['h4','Võ Khánh Vy','Kỹ thuật',-30,8],['h5','Đặng Gia Bảo','Vận hành',-5,0]];
  const T=['Nộp hồ sơ và ký hợp đồng','Nhận laptop và tài khoản','Đọc nội quy lao động','Gặp mentor buổi đầu','Học khóa An toàn thông tin','Dự buổi giới thiệu phòng ban','Đặt mục tiêu 30 ngày','Hoàn thành dự án nhỏ đầu tiên'];let n=0;const tasks=[];
  H.forEach(h=>T.forEach((t,j)=>tasks.push({id:'t'+ ++n,title:t,hire:h[0],due:day(h[3]+j*4+2),done:j<h[4]})));
  return{hires:H.map(h=>({id:h[0],name:h[1],dept:h[2],start:day(h[3])})),tasks,
  checkins:[['h1',-3,'Tốt','Làm quen nhanh, đã cài xong môi trường làm việc.'],['h2',-9,'Bình thường','Cần thêm tài liệu về quy trình thiết kế.'],['h3',-6,'Khó khăn','Chưa rõ mục tiêu 30 ngày, cần họp lại với quản lý.'],['h4',-2,'Tốt','Đã hoàn thành dự án nhỏ, sẵn sàng nhận việc mới.']].map((c,i)=>({id:'c'+i,hire:c[0],date:day(c[1]),mood:c[2],note:c[3]})),
  qa:[],risk:{},set:{theme:'auto',ai:true,mail:true}}
}

let D;try{D=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!D||!D.hires)D=mk();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}};
const S={role:'mentor',v:0},app=$('#app');
const pct=h=>{const a=D.tasks.filter(t=>t.hire==h);return a.length?Math.round(a.filter(t=>t.done).length/a.length*100):0};
const nm=id=>(D.hires.find(h=>h.id==id)||{name:'—'}).name,hireOpts=()=>D.hires.map(h=>[h.id,h.name]);
const opts=(a,v)=>a.map(o=>{const[x,l]=Array.isArray(o)?o:[o,o];return`<option value="${esc(x)}"${x==v?' selected':''}>${esc(l)}</option>`}).join('');
const av=n=>{let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))%360;return`<span class="av" style="background:hsl(${h} 45% 36%)" aria-hidden="true">${esc(n.split(' ').slice(-2).map(w=>w[0]).join(''))}</span>`};
const bdg=(t,c)=>`<span class="b ${c}">${esc(t)}</span>`,head=(t,s)=>`<h1>${t}</h1><p class="sub">${s}</p>`;
const sk=(l='')=>`<div class="card" aria-busy="true"><p>${l}</p><div class="sk"></div><div class="sk" style="width:70%"></div><div class="sk" style="width:85%"></div></div>`;
const empty=(t,b='')=>`<div class="em">${EMP}<p>${t}</p>${b}</div>`;
const off=()=>D.set.ai?'':'<p class="note er">AI đang tắt. Quản trị viên có thể bật lại trong Cài đặt hệ thống.</p>';
function toast(m,undo){const t=document.createElement('div');t.className='ts';t.innerHTML=`<span>${esc(m)}</span>`;if(undo){const b=document.createElement('button');b.textContent='Hoàn tác';b.onclick=()=>{undo();t.remove()};t.append(b)}$('#toast').append(t);setTimeout(()=>t.remove(),4500)}
function fld(x,v){const a=`name="${x.n}" id="f-${x.n}"`;if(x.t=='select')return`<select ${a}>${opts(typeof x.o=='function'?x.o():x.o,v)}</select>`;if(x.t=='textarea')return`<textarea ${a} rows="3">${esc(v)}</textarea>`;return`<input ${a} type="${x.t=='email'?'email':x.t||'text'}" value="${esc(v)}">`}
function modal(title,fields,v,ok){const d=$('#dlg');d.innerHTML=`<form id="mf" novalidate><h2>${title}</h2>${fields.map(x=>`<label>${x.l}${x.req?' *':''}${fld(x,v[x.n]??'')}<small class="err" id="e-${x.n}"></small></label>`).join('')}<div class="row" style="justify-content:flex-end;margin:0"><button type="button" class="btn" id="mc">Hủy</button><button class="btn pr">Lưu</button></div></form>`;
$('#mc').onclick=()=>d.close();$('#mf').onsubmit=e=>{e.preventDefault();const o={};let bad=null;fields.forEach(x=>{const el=$('#f-'+x.n),val=el.value.trim();let m='';if(x.req&&!val)m='Vui lòng nhập '+x.l.toLowerCase()+'.';$('#e-'+x.n).textContent=m;el.setAttribute('aria-invalid',!!m);if(m&&!bad)bad=el;o[x.n]=x.t=='number'?+val:val});if(bad)return bad.focus();d.close();ok(o)};d.showModal()}

function crud(c){
  const m=$('#main'),L=()=>D[c.key];let q='',f='';
  m.innerHTML=head(c.t,c.s)+`<div class="bar"><input id="q" type="search" placeholder="Tìm kiếm…" aria-label="Tìm kiếm">${c.fl?`<select id="fl" aria-label="Lọc"><option value="">${c.fl.l}</option>${opts(c.fl.o())}</select>`:''}<button class="btn pr" id="add">+ Thêm mới</button></div><div id="tb">${sk('Đang tải dữ liệu…')}</div>`;
  const draw=()=>{
    const r=L().filter(x=>(!f||x[c.fl.k]==f)&&norm(c.cols.map(k=>k.r?k.r(x).replace(/<[^>]+>/g,''):x[k.k]).join(' ')).includes(norm(q)));
    $('#tb').innerHTML=r.length?`<div class="tw"><table><thead><tr>${c.cols.map(k=>`<th>${k.l}</th>`).join('')}<th><span class="sr">Thao tác</span></th></tr></thead><tbody>${r.map(x=>`<tr>${c.cols.map(k=>`<td>${k.r?k.r(x):esc(x[k.k])}</td>`).join('')}<td class="ac"><button class="btn sm" data-x="e" data-id="${x.id}">Sửa</button> <button class="btn sm" data-x="d" data-id="${x.id}">Xóa</button></td></tr>`).join('')}</tbody></table></div>`:empty('Chưa có dữ liệu.');
  };
  setTimeout(draw,200);
  const form=(v,ok)=>modal(v.id?'Sửa thông tin':'Thêm mới',c.f,v,ok);
  $('#q').oninput=e=>{q=e.target.value;draw()};if(c.fl)$('#fl').onchange=e=>{f=e.target.value;draw()};
  $('#add').onclick=()=>form({},o=>{L().unshift({id:'x'+Date.now(),status:'active',...(c.def||{}),...o});save();draw();toast('Đã thêm mới')});
  m.onclick=e=>{const b=e.target.closest('[data-x]');if(!b)return;const id=b.dataset.id,x=L().find(y=>y.id==id),k=b.dataset.x;
  if(k=='e')form(x,o=>{Object.assign(x,o);save();draw();toast('Đã lưu thay đổi')});
  if(k=='d'){const i=L().indexOf(x);L().splice(i,1);save();draw();toast('Đã xóa',()=>{L().splice(i,0,x);save();draw()})}}
}

/* ===== Các hàm Mentor nguyên bản từ file BAITAP1_2.html ===== */
let RES=null;
function riskOf(h){const a=D.tasks.filter(t=>t.hire==h.id),od=a.filter(t=>!t.done&&t.due<day(0)).length,p=pct(h.id),c=D.checkins.filter(x=>x.hire==h.id).sort((x,y)=>y.date>x.date?1:-1)[0],gap=c?Math.round((Date.now()-new Date(c.date))/864e5):null;let s=0;const r=[];
if(od){s+=Math.min(od,3);r.push(od+' việc quá hạn')}if(p<40){s++;r.push('Tiến độ mới đạt '+p+'%')}if(gap===null||gap>7){s++;r.push(gap===null?'Chưa có check-in nào':gap+' ngày chưa check-in')}if(c&&c.mood=='Khó khăn'){s+=2;r.push('Check-in gần nhất ghi nhận khó khăn')}return{lv:s>=4?'high':s>=2?'mid':'low',r}}

function vMentees(){const m=$('#main');let q='',f='';
m.innerHTML=head('Mentee của tôi','Theo dõi tiến độ và phát hiện sớm người có nguy cơ chậm.')+`<div class="bar"><input id="q" type="search" placeholder="Tìm mentee…" aria-label="Tìm mentee"><select id="fl" aria-label="Lọc phòng ban"><option value="">Mọi phòng ban</option>${opts([...new Set(D.hires.map(h=>h.dept))])}</select><button class="btn pr" id="run" ${D.set.ai?'':'disabled'}>Phân tích rủi ro bằng AI</button></div>${off()}<div id="ai"></div><div id="tb" class="grid"></div>`;
const draw=()=>{const r=D.hires.filter(h=>(!f||h.dept==f)&&norm(h.name).includes(norm(q)));$('#tb').innerHTML=r.length?r.map(h=>{const p=pct(h.id),k=RES&&RES[h.id],c=D.checkins.filter(x=>x.hire==h.id).sort((x,y)=>y.date>x.date?1:-1)[0];
return`<div class="card"><div class="row" style="margin-bottom:.5rem">${av(h.name)}<div><b>${esc(h.name)}</b><br><small style="color:var(--mut)">${esc(h.dept)} · vào ${fd(h.start)}</small></div></div><div class="pg" role="progressbar" aria-valuenow="${p}" aria-valuemin="0" aria-valuemax="100"><i style="width:${p}%"></i></div><p><small>${p}% hoàn thành · Check-in gần nhất: ${c?fd(c.date):'chưa có'}</small></p>${D.risk[h.id]?bdg('Đã cảnh báo HR','er'):''}${k?`<div class="note" style="margin-top:.5rem">Rủi ro chậm: ${bdg(LV[k.lv][0],LV[k.lv][1])}<details open><summary>Vì sao?</summary><ul style="margin:.2rem 0;padding-left:1.1rem">${k.r.length?k.r.map(x=>`<li>${esc(x)}</li>`).join(''):'<li>Chưa thấy dấu hiệu bất thường</li>'}</ul></details>${k.lv!='low'&&!D.risk[h.id]?`<button class="btn sm pr" data-x="ok" data-id="${h.id}">Xác nhận cảnh báo</button> `:''}<button class="btn sm" data-x="sk" data-id="${h.id}">Bỏ qua</button></div>`:''}</div>`}).join(''):empty('Không tìm thấy mentee phù hợp.')};draw();
const run=async()=>{$('#ai').innerHTML=sk('AI đang phân tích tiến độ và check-in…');await wait(1100);if(!D.hires.length){$('#ai').innerHTML='<div class="card warn"><p>Không đủ dữ liệu để đưa ra đề xuất.</p></div>';return}
RES={};D.hires.forEach(h=>RES[h.id]=riskOf(h));const n=Object.values(RES).filter(x=>x.lv!='low').length;$('#ai').innerHTML=`<div class="note" style="margin-bottom:1rem">AI phát hiện <b>${n}</b> mentee cần chú ý. Kết quả chỉ là gợi ý, bạn quyết định có cảnh báo HR hay không. <button class="btn sm" id="rg">Tạo lại</button></div>`;$('#rg').onclick=run;draw()};
$('#run').onclick=run;$('#q').oninput=e=>{q=e.target.value;draw()};$('#fl').onchange=e=>{f=e.target.value;draw()};
$('#tb').onclick=e=>{const b=e.target.closest('[data-x]');if(!b)return;if(b.dataset.x=='ok'){D.risk[b.dataset.id]={at:day(0),r:RES[b.dataset.id].r,lv:RES[b.dataset.id].lv};save();toast('Đã gửi cảnh báo tới HR')}else delete RES[b.dataset.id];draw()}}

function vCI(){crud({key:'checkins',t:'Ghi chú check-in',s:'Lưu lại nội dung các buổi trao đổi với mentee.',fl:{k:'hire',l:'Mọi mentee',o:hireOpts},cols:[{k:'date',l:'Ngày',r:x=>fd(x.date)},{k:'hire',l:'Mentee',r:x=>esc(nm(x.hire))},{k:'mood',l:'Tâm trạng',r:x=>bdg(x.mood,x.mood=='Tốt'?'ok':x.mood=='Khó khăn'?'er':'wa')},{k:'note',l:'Ghi chú'}],f:[{n:'hire',l:'Mentee',t:'select',o:hireOpts},{n:'date',l:'Ngày',t:'date',req:1},{n:'mood',l:'Tâm trạng',t:'select',o:['Tốt','Bình thường','Khó khăn']},{n:'note',l:'Ghi chú',t:'textarea',req:1,min:10}],def:{hire:'h1',date:day(0),mood:'Tốt'}})}

function vAssign(){crud({key:'tasks',t:'Giao việc cho mentee',s:'Tạo và theo dõi các việc hội nhập của từng người.',fl:{k:'hire',l:'Mọi mentee',o:hireOpts},cols:[{k:'title',l:'Việc'},{k:'hire',l:'Mentee',r:x=>esc(nm(x.hire))},{k:'due',l:'Hạn',r:x=>fd(x.due)},{k:'done',l:'Trạng thái',r:x=>x.done?bdg('Hoàn thành','ok'):x.due<day(0)?bdg('Quá hạn','er'):bdg('Đang chờ','wa')}],f:[{n:'title',l:'Tên việc',req:1,min:4},{n:'hire',l:'Giao cho',t:'select',o:hireOpts},{n:'due',l:'Hạn hoàn thành',t:'date',req:1}],def:{done:false,hire:'h1'}})}

const V=[['Mentee',vMentees],['Check-in',vCI],['Giao việc',vAssign]];

function shell(){
  const v=V;
  app.innerHTML=`<header class="top"><b class="logo">${LOGO}OnboardAI</b>${bdg(RL[S.role],'pr')}<span class="sp"></span><button class="btn" id="out">Đăng xuất</button></header><div class="ly"><nav aria-label="Điều hướng">${v.map((x,i)=>`<button data-i="${i}" ${i==S.v?'aria-current="page"':''}>${x[0]}</button>`).join('')}</nav><main id="main" tabindex="-1"></main></div>`;
  app.querySelector('nav').onclick=e=>{const b=e.target.closest('button');if(b){S.v=+b.dataset.i;shell()}};
  $('#out').onclick=()=>{location.href='login.html'};
  v[S.v][1]();
}

shell();
</script>
</body>
</html>
